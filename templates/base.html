{% from "_icons.html" import icon with context %}
<!doctype html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}Chatbot Tematik{% endblock %}</title>
  <script>
    /* Terapkan tema tersimpan sebelum render agar tidak berkedip. Default: gelap. */
    (function () {
      try {
        var t = localStorage.getItem("tema-ui");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="{{ url_for('static', filename='fonts/IBMPlexSans-400.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#konten">Lewati ke konten</a>
  {% block body %}{% endblock %}

  {#- Ikon yang dipakai ulang oleh JavaScript -#}
  <template id="ikon-sun">{{ icon("sun", 20) }}</template>
  <template id="ikon-moon">{{ icon("moon", 20) }}</template>
  <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
